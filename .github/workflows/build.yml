name: Build and Release

on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pack version and release tag
      - name: Resolve version
        id: version
        run: |
          VERSION="$(jq -r '.header.version | map(tostring) | join(".")' manifest.json)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"

          SKIP=false
          PRERELEASE=false

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            # Push only releases new versions, manual runs get a prerelease build
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              SKIP=true
            fi
            TAG="v$VERSION+$SHORT_SHA"
            FILE="ZK_UI_Pack_v${VERSION}_$SHORT_SHA.mcpack"
            PRERELEASE=true
          else
            TAG="v$VERSION"
            FILE="ZK_UI_Pack_v$VERSION.mcpack"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          if [ "$SKIP" = "true" ]; then
            echo "Version v$VERSION already released, skipping"
          else
            echo "Release: $TAG ($FILE)"
          fi

      # Zip pack contents, then rename to mcpack
      - name: Build mcpack
        if: steps.version.outputs.skip != 'true'
        run: |
          zip -r -q -X pack.zip . \
            -x ".git/*" ".github/*" ".gitignore" ".gitattributes" \
               "*.md" "LICENSE*" "*.zip" "*.mcpack"

          # Manifest must sit at the zip root
          unzip -l pack.zip | awk '{print $4}' | grep -qx "manifest.json"

          mv pack.zip "${{ steps.version.outputs.file }}"

      # Release notes from the About changelog
      - name: Build release notes
        if: steps.version.outputs.skip != 'true'
        run: python3 .github/scripts/release_notes.py "${{ steps.version.outputs.version }}" > release_notes.md

      # Publish release
      - name: Create release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FILE: ${{ steps.version.outputs.file }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" "$FILE" \
              --target "$GITHUB_SHA" \
              --title "ZK UI Pack $TAG" \
              --notes-file release_notes.md \
              --generate-notes \
              --prerelease
          else
            gh release create "$TAG" "$FILE" \
              --target "$GITHUB_SHA" \
              --title "ZK UI Pack $TAG" \
              --notes-file release_notes.md \
              --generate-notes \
              --latest
          fi
